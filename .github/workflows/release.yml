name: release

# A tag <bot>-v<version> (distilled-v0.2.0) builds that bot's library on Linux and Windows, packages the downloads and
# publishes them as a GitHub Release. A manual run builds the same packages as a workflow artifact without releasing.
# docs/design/2026-11-07-bot-releases.md §3.2; how to cut a release: docs/harness/release.md.
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      bot:
        description: 'the bot to package: a directory of bots/'
        required: true
        default: distilled
        type: string

permissions:
  contents: write

jobs:
  name:
    runs-on: ubuntu-22.04
    outputs:
      bot: ${{ steps.name.outputs.bot }}
      crate: ${{ steps.name.outputs.crate }}
      lib: ${{ steps.name.outputs.lib }}
      version: ${{ steps.name.outputs.version }}
      short: ${{ steps.name.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          INPUT_BOT: ${{ inputs.bot }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bot=${GITHUB_REF_NAME%-v*}
            tagged=${GITHUB_REF_NAME##*-v}
          else
            bot=$INPUT_BOT
            tagged=
          fi
          [ -f "bots/$bot/Cargo.toml" ] || { echo "::error::no bot at bots/$bot"; exit 1; }
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "bots/$bot/Cargo.toml" | head -n 1)
          if [ -n "$tagged" ] && [ "$tagged" != "$version" ]; then
            echo "::error::the tag says $tagged but bots/$bot/Cargo.toml says $version: the tagged commit bumps the crate"
            exit 1
          fi
          # The notes come from the changelog's top section, which must be this version's: refused here, before the builds.
          if [ -n "$tagged" ]; then
            run/release_notes.sh "$bot" "$version" > /dev/null
          fi
          short=$(python3 -c "import re,sys; print(re.search(r\"key\s*=\s*'shortName'\s*,\s*value\s*=\s*'([^']*)'\", open(sys.argv[1]).read(), re.S).group(1))" "bots/$bot/data/AIInfo.lua")
          {
            echo "bot=$bot"
            echo "crate=bot-$bot"
            echo "lib=bot_$bot"
            echo "version=$version"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"
          echo "$short $version from bots/$bot (crate bot-$bot)"

  build:
    needs: name
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: glibc 2.35, so the .so loads on the distributions and Flatpak runtimes players have.
          - os: ubuntu-22.04
            file: lib${{ needs.name.outputs.lib }}.so
          - os: windows-latest
            file: ${{ needs.name.outputs.lib }}.dll
    runs-on: ${{ matrix.os }}
    env:
      CRATE: ${{ needs.name.outputs.crate }}
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.name.outputs.crate }}
      # bindgen reads the vendored engine headers (crates/recoil-ai-sys/vendor) and needs libclang at build time.
      - name: libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: libclang (the runner's LLVM)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Tests of the bot and the shared crates
        if: runner.os == 'Linux'
        run: cargo test --release -p "$CRATE" -p ai-host -p bot-protocol -p micro -p layout -p combatsim -p terrain -p nukes
      - name: Build
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p "$CRATE"
          strip "target/release/$FILE"
      # +crt-static: the DLL carries its C runtime and needs no Visual C++ redistributable (the engine is a MinGW build
      # and promises none).
      - name: Build
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p $env:CRATE
      - name: The three entry points are exported
        if: runner.os == 'Linux'
        run: |
          nm -D --defined-only "target/release/$FILE" | grep -E ' T (init|release|handleEvent)$' | tee exports.txt
          [ "$(wc -l < exports.txt)" -eq 3 ]
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: The three entry points are exported
        if: runner.os == 'Windows'
        run: |
          $exports = (dumpbin /exports "target\release\$env:FILE" | Out-String)
          Write-Host $exports
          foreach ($name in @('init', 'release', 'handleEvent')) {
            if ($exports -notmatch "(?m)\s$name\s*$") { Write-Error "$name is not exported from $env:FILE"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: target/release/${{ matrix.file }}
          if-no-files-found: error

  package:
    needs: [name, build]
    runs-on: ubuntu-22.04
    env:
      BOT: ${{ needs.name.outputs.bot }}
      LIB: ${{ needs.name.outputs.lib }}
      VERSION: ${{ needs.name.outputs.version }}
      SHORT: ${{ needs.name.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: libs
      - name: Package
        run: |
          run/release_package.py "$BOT" --so "libs/ubuntu-22.04/lib$LIB.so" --dll "libs/windows-latest/$LIB.dll" --out dist \
            --url "https://github.com/$GITHUB_REPOSITORY"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.name.outputs.short }}-${{ needs.name.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run/release_notes.sh "$BOT" "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$SHORT $VERSION" --notes-file notes.md
