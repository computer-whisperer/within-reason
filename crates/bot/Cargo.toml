[package]
name = "bot"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Bot process: serves AI shim connections and decides what each AI does"

[dependencies]
bot-protocol = { path = "../bot-protocol" }
terrain = { path = "../terrain" }
buildorder = { path = "../buildorder" }
combatsim = { path = "../combatsim" }
micro = { path = "../micro" }
jev = { path = "../jev" }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
